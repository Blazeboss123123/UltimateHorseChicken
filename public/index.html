<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ultimate Horse Chicken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2a1e; --paper:#fff6e6; --paper2:#f6e6c8; --wood:#b07a45; --wood2:#8a5a30;
  --accent:#e8573f; --good:#3fae5a; --bad:#d8433a; --sky:#a8e6ef; --ui-scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#ui > *{pointer-events:auto}
.backdrop{position:fixed;inset:0;background:rgba(40,28,18,.35);display:flex;align-items:center;justify-content:center;z-index:10}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 rgba(58,42,30,.35),0 18px 40px rgba(0,0,0,.25);padding:18px 22px;max-width:min(920px,94vw);max-height:90vh;overflow:auto;transform:scale(var(--ui-scale));transform-origin:center;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(calc(var(--ui-scale)*.85));opacity:0}to{transform:scale(var(--ui-scale));opacity:1}}
.panel h2{margin:0 0 10px;font-size:30px;display:flex;align-items:center;gap:10px}
.panel h3{margin:14px 0 6px;font-size:19px;border-bottom:2px dashed rgba(58,42,30,.3);padding-bottom:3px}
.panel p{margin:6px 0;line-height:1.35}
.small{font-size:13px;opacity:.75}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.grid{display:grid;gap:8px}
.btn{font:inherit;font-weight:600;font-size:17px;background:#ffd56b;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#bfe8ff}.btn.red{background:#ff9e8c}.btn.green{background:#a9e59a}.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.f:focus,.f.focus{outline:4px solid #ff5fa2;outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{font:inherit;font-weight:600;padding:5px 12px;border:3px solid var(--ink);border-radius:10px 10px 4px 4px;background:var(--paper2);cursor:pointer}
.tab.on{background:#ffd56b}
label.set{display:grid;grid-template-columns:minmax(150px,1fr) 180px 64px;align-items:center;gap:10px;margin:5px 0;font-weight:500}
label.set input[type=range]{width:100%;accent-color:#e8573f}
label.set select,input.txt{font:inherit;border:3px solid var(--ink);border-radius:8px;padding:3px 6px;background:#fff}
.val{font-weight:700;text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px;text-align:center;cursor:pointer;position:relative}
.card.on{background:#ffe9a8;box-shadow:0 0 0 3px #ff5fa2 inset}
.card.locked{opacity:.5;cursor:not-allowed}
.card canvas{display:block;margin:0 auto}
.card .nm{font-weight:600;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;margin:1px}
.ach{display:flex;gap:10px;align-items:center;border:2px solid rgba(58,42,30,.3);border-radius:10px;padding:6px 8px;margin:4px 0;background:#fff}
.ach.no{opacity:.45;filter:grayscale(1)}
.ach .ico{font-size:26px;width:34px;text-align:center}
table.stats{border-collapse:collapse;width:100%}
table.stats td{padding:4px 8px;border-bottom:1px dashed rgba(58,42,30,.25)}
table.stats td:last-child{text-align:right;font-weight:700}
.bind{font:inherit;font-weight:600;min-width:120px;padding:4px 8px;border:3px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer}
.bind.wait{background:#ffd56b}
#toasts{position:fixed;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none}
.toast{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:600;box-shadow:0 4px 0 rgba(58,42,30,.3);animation:tin .25s ease-out;max-width:340px}
.toast.gold{background:#ffe9a8}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#editbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:6px 8px;z-index:6;max-width:98vw;flex-wrap:wrap;justify-content:center}
#editbar .btn{font-size:14px;padding:4px 10px}
#palette{position:fixed;left:8px;top:60px;bottom:70px;width:178px;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px;z-index:6}
#palette .pi{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
#palette .pi.on{background:#ffd56b}
#palette .pi canvas{flex:none}
#palette .cat{font-size:12px;font-weight:700;opacity:.6;margin:6px 4px 2px;text-transform:uppercase}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;width:100%;min-height:80px;border:3px solid var(--ink);border-radius:8px;padding:6px;word-break:break-all}
.kbd{display:inline-block;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;padding:0 6px;font-weight:700;font-size:13px;background:#fff;margin:0 2px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;background:var(--sky);z-index:50}
.btn.sm{font-size:14px;padding:4px 10px}
.btn.big{font-size:21px;padding:10px 16px;width:100%}
/* ---- title screen notice board ---- */
#titleui{position:fixed;inset:0;pointer-events:none;z-index:6;display:flex;justify-content:center;align-items:flex-start;padding:var(--top,0px) 12px 12px}
#titleui.wide{justify-content:flex-end;align-items:center;padding:16px max(28px,6vw) 16px 16px}
#titleui .board{pointer-events:auto;width:min(430px,96vw);max-height:calc(100vh - var(--top,0px) - 16px);overflow:auto;position:relative;
  background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(0,0,0,.08)),repeating-linear-gradient(180deg,#c88d52 0 44px,#a8703e 44px 47px);
  border:5px solid #5a3a1e;border-radius:18px;padding:14px 16px 16px;box-shadow:0 10px 0 rgba(58,42,30,.45),0 24px 50px rgba(0,0,0,.3);animation:pop .25s ease-out}
#titleui .board::before,#titleui .board::after{content:'';position:absolute;top:10px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#eee,#777);border:1px solid #444}
#titleui .board::before{left:10px}#titleui .board::after{right:10px}
#titleui .sec,#titleui .who{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:12px 14px;margin-top:12px;position:relative;box-shadow:0 4px 0 rgba(58,42,30,.35)}
#titleui .who{margin-top:4px;display:flex;gap:12px;align-items:center;transform:rotate(-.6deg)}
#titleui .sec.online{transform:rotate(.4deg)}
#titleui .sec::before,#titleui .who::before{content:'';position:absolute;top:-9px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#c0352d);border:2px solid var(--ink)}
#titleui .who canvas{border:3px solid var(--ink);border-radius:12px;background:#d6f5fa;flex:none}
#titleui .whof{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
#titleui .whof label{font-size:13px;font-weight:700;opacity:.7}
#titleui .whof .nm{font:inherit;font-weight:600;font-size:18px;border:3px solid var(--ink);border-radius:9px;padding:4px 8px;width:100%;background:#fff;user-select:text}
#titleui .sec-h{font-size:20px;font-weight:700;margin-bottom:8px;text-align:center}
#titleui .or{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;opacity:.75;margin:12px 0 4px}
#titleui .or::before,#titleui .or::after{content:'';flex:1;border-top:2px dashed rgba(58,42,30,.35)}
#titleui .codein{display:flex;gap:6px;justify-content:center;margin:8px 0 10px}
#titleui .tile-in{width:44px;height:52px;min-width:0;flex:0 1 44px;text-align:center;font:700 26px 'Fredoka',sans-serif;color:var(--ink);background:linear-gradient(#fdf0d4,#efcf98);border:3px solid var(--ink);border-radius:9px;box-shadow:0 4px 0 #8a5a30;text-transform:uppercase;caret-color:#e8473f;user-select:text;padding:0}
#titleui .tile-in:focus{outline:3px solid #ff5fa2;outline-offset:1px}
#titleui .status{min-height:20px;font-size:14px;font-weight:600;text-align:center;margin-top:8px;line-height:1.3}
#titleui .status.err{color:#c0352d}#titleui .status.warn{color:#8a5a10}#titleui .status.ok{color:#2f8a46}
#titleui .sec.off .btn,#titleui .sec.off input{opacity:.45}
#titleui .local{display:flex;flex-direction:column;gap:8px;background:rgba(255,246,230,.92)}
#titleui .local .btn.alt{font-size:18px;padding:8px 14px}
#titleui .row.mini{justify-content:center;margin:0}
#titleui .btn.ghost{background:rgba(255,255,255,.5)}
/* ---- the game-code bar in the treehouse ---- */
#netbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:96vw;
  background:repeating-linear-gradient(180deg,#c88d52 0 22px,#a8703e 22px 24px);border:4px solid #5a3a1e;border-radius:14px;padding:6px 12px;box-shadow:0 5px 0 rgba(58,42,30,.4);color:#fff6e6;font-weight:700;text-shadow:0 2px 0 #5a3a1e}
#netbar.mini{display:none!important}
#chat{position:fixed;left:12px;bottom:58px;z-index:7;width:min(360px,calc(100vw - 24px));pointer-events:none;font-weight:600}
#chat.lobby{bottom:118px}
#chat .ch-log{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
#chat .ch-m{align-self:flex-start;max-width:100%;background:rgba(40,28,18,.72);color:#fff;padding:4px 10px;border-radius:10px;font-size:14px;line-height:1.3;overflow-wrap:anywhere;transition:opacity .8s}
#chat .ch-m b{margin-right:4px;text-shadow:0 1px 0 rgba(0,0,0,.5);filter:brightness(1.35)}
#chat .ch-m.fade{opacity:.35}
#chat .ch-bar{display:none;pointer-events:auto;gap:6px;align-items:center;background:#fff6e6;border:3px solid var(--ink);border-radius:12px;padding:5px;box-shadow:0 4px 0 rgba(58,42,30,.35)}
#chat.open .ch-bar{display:flex}
#chat .ch-in{flex:1;min-width:0;font:inherit;font-size:15px;border:none;outline:none;background:none;color:var(--ink);padding:4px 6px}
#chat .ch-emo{display:flex;gap:2px}
#chat .ch-emo button{font-size:17px;line-height:1;border:none;background:none;cursor:pointer;padding:3px;border-radius:6px}
#chat .ch-emo button:hover{background:#f0dcb8}
#chat .ch-hint{display:inline-block;font-size:12px;color:#fff;background:rgba(40,28,18,.5);padding:3px 9px;border-radius:9px;opacity:.85}
#chat.open .ch-hint{display:none}
#netbar{position:fixed}
#netbar .nb-min{position:absolute;top:-14px;right:14px;width:34px;height:24px;border:2px solid var(--ink);border-radius:8px 8px 0 0;border-bottom:none;background:#c8915a;color:#fff;font:inherit;font-size:15px;line-height:1;cursor:pointer;padding:0}
#netbar .nb-min:hover{background:#d9a46c}
#netbar.collapsed{padding:0;background:none;border:none;box-shadow:none;gap:0}
#netbar .nb-tab{font:inherit;font-size:14px;color:#fff;background:linear-gradient(#c8915a,#a8743e);border:2.5px solid var(--ink);border-radius:12px;padding:5px 14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.35);letter-spacing:.04em}
#netbar .nb-tab:hover{filter:brightness(1.08)}
#netbar .nb-tab .nb-n{font-size:12px;opacity:.9}
#netbar .lbl{font-size:12px;letter-spacing:.1em}
#netbar .tiles{display:flex;gap:3px}
#netbar .tile{display:inline-flex;width:27px;height:32px;align-items:center;justify-content:center;background:linear-gradient(#fdf0d4,#efcf98);color:var(--ink);border:2px solid var(--ink);border-radius:6px;font-size:19px;box-shadow:0 2px 0 #8a5a30;text-shadow:none;user-select:text}
#netbar .nb-info{font-size:12px}
#netbar .btn{text-shadow:none}
@media (max-height:700px){#titleui .board{padding:10px 12px 12px}#titleui .sec,#titleui .who{padding:8px 12px;margin-top:9px}#titleui .who canvas{width:66px;height:72px}#titleui .btn.big{font-size:18px;padding:7px 12px}#titleui .tile-in{height:42px;font-size:22px}#titleui .sec-h{font-size:17px;margin-bottom:6px}#titleui .or{margin:8px 0 2px}#titleui .whof .nm{font-size:16px;padding:2px 8px}#titleui .local .btn.alt{font-size:16px;padding:6px 12px}}
@media (max-width:520px){#titleui .tile-in{height:46px;font-size:22px}#netbar .lbl,#netbar .nb-info{display:none}}
@media (max-width:700px){label.set{grid-template-columns:1fr 120px 50px}.panel h2{font-size:24px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="toasts"></div>
<div id="loading">Loading Ultimate Horse Chicken…</div>

</body>
